<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Die %KUNDE_*%-Platzhalter füllt das Plugin "kunde-html" in
         vite.config.ts aus src/kunde.config.ts. Hier nichts hart eintragen. -->
    <title>%KUNDE_TITEL%</title>
    <meta name="description" content="%KUNDE_BESCHREIBUNG%" />
    <meta name="author" content="%KUNDE_FIRMA%" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- PWA -->
    <!-- Kopfleiste wie im Manifest (theme_color): SETEC-Schwarz, nicht die Aktionsfarbe -->
    <meta name="theme-color" content="#121110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%KUNDE_KURZNAME%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%KUNDE_TITEL%" />
    <meta property="og:description" content="%KUNDE_BESCHREIBUNG%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%KUNDE_TITEL%" />
    <meta name="twitter:description" content="%KUNDE_BESCHREIBUNG%" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Chrome bietet die Installation genau einmal an, oft bevor das App-Bündel
         geladen ist (schwaches Netz). Hier sofort auffangen; lib/installieren.ts
         übernimmt es aus window.__installPrompt. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });
      window.addEventListener('appinstalled', function () { window.__installPrompt = null; });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Nach einem Deployment sind die alten Chunk-Dateien weg. Statt einer
      // weißen Seite lädt die App sich in dem Fall einmal neu.
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
          window.location.reload();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Failed to fetch dynamically imported module')) {
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
